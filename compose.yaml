services:
  postgres:
    image: postgres:16-alpine
    container_name: jcc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jenkins_cc}
      POSTGRES_USER: ${POSTGRES_USER:-jenkins_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jenkins_secure_password_replace_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jenkins_admin} -d ${POSTGRES_DB:-jenkins_cc}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jcc-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jcc-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-jenkins_admin}:${POSTGRES_PASSWORD:-jenkins_secure_password_replace_me}@postgres:5432/${POSTGRES_DB:-jenkins_cc}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production-to-a-secure-random-32-byte-hex-string}
      - SECRET_KEY_ENCRYPTION=${SECRET_KEY_ENCRYPTION:-8Z1xVj1xV8zQY7P4wN1vK6tR3bM9eL2sA5hG0yD4fUo=}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jcc-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app.celery", "worker", "--loglevel=info", "--concurrency=4"]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-jenkins_admin}:${POSTGRES_PASSWORD:-jenkins_secure_password_replace_me}@postgres:5432/${POSTGRES_DB:-jenkins_cc}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY_ENCRYPTION=${SECRET_KEY_ENCRYPTION:-8Z1xVj1xV8zQY7P4wN1vK6tR3bM9eL2sA5hG0yD4fUo=}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jcc-beat
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app.celery", "beat", "--loglevel=info"]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-jenkins_admin}:${POSTGRES_PASSWORD:-jenkins_secure_password_replace_me}@postgres:5432/${POSTGRES_DB:-jenkins_cc}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY_ENCRYPTION=${SECRET_KEY_ENCRYPTION:-8Z1xVj1xV8zQY7P4wN1vK6tR3bM9eL2sA5hG0yD4fUo=}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jcc-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
